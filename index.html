<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>

<body>

<h1>Course Registration Form</h1>

<form>

    <!-- First Name -->
    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" value="Chanti Chitra Rekha" required>
    <br><br>

    <!-- Surname -->
    <label for="sname">Surname:</label>
    <input type="text" id="sname" name="sname" value="Kota">
    <br><br>

    <!-- Mobile Number -->
    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" value="7207157748" required>
    <br><br>

    <!-- Email -->
    <label for="email">Email ID:</label>
    <input type="email" id="email" name="email" value="kotachantichitrarekha@gmail.com" required>
    <br><br>

    <!-- Password -->
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" value="Chitra@123" required>
    <br><br>

    <!-- Confirm Password -->
    <label for="cpassword">Confirm Password:</label>
    <input type="password" id="cpassword" name="cpassword" value="Chitra@123" required>
    <br><br>

    <!-- Date of Birth -->
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" value="2004-09-02">
    <br><br>

    <!-- Age -->
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" value="21" min="18" max="65">
    <br><br>

    <!-- Gender -->
    <label>Gender:</label>
    <input type="radio" id="female" name="gender" value="female" checked>
    <label for="female">Female</label>

    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>

    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>
    <br><br>

    <!-- Country -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="germany">Germany</option>
    </select>
    <br><br>

    <!-- Upload Resume -->
    <label for="resume">Upload Resume:</label>
    <input type="file" id="resume" name="resume">
    <br><br>

    <!-- Buttons -->
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
